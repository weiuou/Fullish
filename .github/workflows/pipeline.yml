name: CI and delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Run the first deployment even while automatic deployment is disabled
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Docs pushes must not replace queued code runs. Only obsolete PR runs may stop.
concurrency:
  group: fullish-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose documentation or full CI
        id: classify
        run: python3 scripts/classify_changes.py

  checks:
    name: Quality and deployment tests
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        run: python3 scripts/check_docs.py
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        if: needs.changes.outputs.runtime == 'true'
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked --group deploy
        if: needs.changes.outputs.runtime == 'true'
      - run: uv run --locked ruff check .
        if: needs.changes.outputs.runtime == 'true'
      - run: uv run --locked ruff format --check .
        if: needs.changes.outputs.runtime == 'true'
      - run: uv run --locked --group deploy pyright
        if: needs.changes.outputs.runtime == 'true'
      - run: uv run --locked --group deploy pytest
        if: needs.changes.outputs.runtime == 'true'
      - name: Check deployment scripts
        if: needs.changes.outputs.runtime == 'true'
        run: |
          for script in scripts/*.sh deploy/*.sh tests/*.sh; do bash -n "$script"; done
          bash tests/deploy_smoke.sh

  container:
    name: Build and verify container
    needs: [changes, checks]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: fullish:ci
          build-args: APP_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify server initialization in an isolated container
        run: |
          docker run --rm --user 0 --network none \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --env FULLISH_SETUP_TEST_CONTAINER=1 \
            --entrypoint bash fullish:ci /workspace/tests/setup_smoke.sh
      - name: Verify the built image
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash scripts/container-smoke.sh fullish:ci "$EXPECTED_REVISION"
      - name: Export the verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save --output fullish-image.tar fullish:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: verified-image
          path: fullish-image.tar
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified image
    if: needs.changes.outputs.runtime == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [changes, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-image
      - name: Resolve repository
        id: registry
        env:
          CUSTOM_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        shell: bash
        run: |
          repository="${CUSTOM_REPOSITORY:-ghcr.io/${GITHUB_REPOSITORY,,}}"
          if [[ ! $repository =~ ^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$ ]]; then
            echo 'IMAGE_REPOSITORY must be a lowercase registry/repository without tag or digest.' >&2
            exit 1
          fi
          printf 'repository=%s\nregistry=%s\n' "$repository" "${repository%%/*}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: vars.IMAGE_REPOSITORY == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to custom registry
        if: vars.IMAGE_REPOSITORY != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push the same image that passed the smoke test
        id: push
        env:
          IMAGE_REPOSITORY: ${{ steps.registry.outputs.repository }}
        shell: bash
        run: |
          docker load --input fullish-image.tar
          tag="$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          docker tag fullish:ci "$tag"
          docker push "$tag"
          image=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | awk -v prefix="$IMAGE_REPOSITORY@sha256:" 'index($0, prefix)==1 { print; exit }')
          [[ $image =~ @sha256:[a-f0-9]{64}$ ]] || { echo 'Registry digest missing.' >&2; exit 1; }
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Published verified image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Tencent Cloud
    if: (vars.DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: fullish-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip superseded code, allow newer documentation
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ $head != "$GITHUB_SHA" ]]; then
            gh auth setup-git
            git fetch --quiet --no-tags origin "$head"
          fi
          python3 scripts/classify_changes.py --deployment-current "$GITHUB_SHA" "$head"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        if: steps.current.outputs.apply == 'true' && vars.DEPLOY_TRANSPORT == 'tat'
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Install locked deployment dependencies
        if: steps.current.outputs.apply == 'true' && vars.DEPLOY_TRANSPORT == 'tat'
        run: uv sync --locked --no-dev --group deploy
      - name: Invoke saved command and wait for its result
        if: steps.current.outputs.apply == 'true' && vars.DEPLOY_TRANSPORT == 'tat'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ vars.TENCENTCLOUD_REGION }}
          TAT_COMMAND_ID: ${{ vars.TAT_COMMAND_ID }}
          TAT_INSTANCE_ID: ${{ vars.TAT_INSTANCE_ID }}
          TAT_WAIT_TIMEOUT: "960"
          FULLISH_IMAGE: ${{ needs.publish.outputs.image }}
        run: uv run --locked --no-dev --group deploy python scripts/tat_deploy.py
      - name: Deploy over restricted SSH
        if: steps.current.outputs.apply == 'true' && vars.DEPLOY_TRANSPORT != 'tat'
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          FULLISH_IMAGE: ${{ needs.publish.outputs.image }}
          REGISTRY_PULL_USERNAME: ${{ vars.REGISTRY_PULL_USERNAME || github.actor }}
          REGISTRY_PULL_PASSWORD: ${{ secrets.REGISTRY_PULL_PASSWORD || github.token }}
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
        run: python3 scripts/ssh_deploy.py
