name: fullish

services:
  bot:
    image: ${FULLISH_IMAGE:?Set FULLISH_IMAGE to a repository@sha256 digest}
    init: true
    restart: unless-stopped
    env_file:
      - path: ./runtime.env
        format: raw
    environment:
      TOOL_AUDIT_PATH: /var/lib/fullish/tool-audit/audit.sqlite3
      GROUP_CONTROL_DIR: /var/lib/fullish/control
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./cpa:/run/fullish-cpa:ro
      # Empty when sandbox tools are disabled. This is the broker socket, not Docker.
      - /run/fullish-sandbox:/run/fullish-sandbox:ro
      - tool-audit:/var/lib/fullish/tool-audit
      - /var/lib/fullish-control:/var/lib/fullish/control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tool-audit:
